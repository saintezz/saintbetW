<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGbrainX — Upgrader</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Orbitron:wght@500;700;900&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Inter', sans-serif; }
        html { scroll-behavior: smooth; }

        body {
            background: #0a0a0f;
            color: #e5e7eb;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .bg-layer {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2; overflow: hidden; pointer-events: none;
        }
        .bg-layer::before {
            content: '';
            position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 140, 0, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 140, 0, 0.08) 0%, transparent 40%);
            animation: bgMove 25s ease-in-out infinite;
        }
        @keyframes bgMove {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-5%, -5%) rotate(8deg); }
        }

        .game-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
            align-items: start;
        }

        /* ===== LIVE BOARD ===== */
        .live-board {
            background: linear-gradient(180deg, rgba(30, 30, 38, 0.95) 0%, rgba(18, 18, 22, 0.95) 100%);
            border: 1px solid rgba(255, 140, 0, 0.25);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(255, 140, 0, 0.08);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
        }

        .live-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 140, 0, 0.15);
        }

        .live-dot {
            width: 10px; height: 10px;
            background: #ff4d4d;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(255, 77, 77, 1);
            animation: livePulse 1.5s ease-in-out infinite;
        }
        .live-dot.offline {
            background: #555;
            box-shadow: 0 0 12px rgba(85, 85, 85, 0.5);
            animation: none;
        }
        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        .live-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px; font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ff4d4d, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            flex: 1;
        }

        .live-status {
            font-size: 9px;
            font-weight: 700;
            color: #7ed88a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .live-status.offline { color: #ff4d4d; }

        .live-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            flex: 1;
            padding-right: 5px;
        }

        .live-list::-webkit-scrollbar { width: 4px; }
        .live-list::-webkit-scrollbar-track { background: transparent; }
        .live-list::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #ff8c00, #cc7000); border-radius: 2px; }

        .live-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            background: linear-gradient(145deg, rgba(255, 140, 0, 0.08) 0%, rgba(255, 140, 0, 0.02) 100%);
            border: 1px solid rgba(255, 140, 0, 0.2);
            border-radius: 12px;
            animation: liveSlideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .live-item::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 200, 100, 0.2), transparent);
            animation: shineSlide 2s ease-in-out;
        }

        @keyframes shineSlide {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        @keyframes liveSlideIn {
            0% { opacity: 0; transform: translateX(-30px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .live-item .live-img {
            width: 42px; height: 42px;
            object-fit: contain;
            filter: drop-shadow(0 0 6px rgba(255, 140, 0, 0.5));
            flex-shrink: 0;
        }

        .live-item .live-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }

        .live-item .live-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px; font-weight: 800;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .live-item .live-price {
            font-size: 11px;
            color: #ffaa33;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 3px;
            font-family: 'Orbitron', sans-serif;
        }

        .live-item .live-coin {
            width: 12px; height: 12px;
            object-fit: contain;
        }

        .live-empty {
            color: #4a4d5e;
            font-size: 12px;
            text-align: center;
            padding: 30px 10px;
            font-weight: 600;
        }

        /* ===== ОСНОВНОЕ ПРИЛОЖЕНИЕ ===== */
        .app {
            width: 100%;
            background: linear-gradient(180deg, rgba(30, 30, 38, 0.95) 0%, rgba(18, 18, 22, 0.95) 100%);
            border-radius: 28px;
            border: 1px solid rgba(255, 140, 0, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 80px rgba(255, 140, 0, 0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding-bottom: 25px;
            backdrop-filter: blur(20px);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 140, 0, 0.1);
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px; font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #d0d0d0 0%, #ff8c00 50%, #ffaa33 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 15px rgba(255, 140, 0, 0.5));
            animation: logoGradient 4s ease infinite;
        }
        @keyframes logoGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .top-right { display: flex; align-items: center; gap: 12px; }

        .balance {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 16px; font-weight: 800;
            display: flex; align-items: center; gap: 8px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
        }

        .coin-icon { width: 20px; height: 20px; object-fit: contain; filter: drop-shadow(0 0 8px rgba(255, 140, 0, 0.8)); }

        .avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff8c00, #cc7000);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900; font-size: 18px; color: #fff;
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.5);
            cursor: pointer;
        }

        .progress-section {
            display: flex; justify-content: center; align-items: center;
            padding: 30px 0 20px;
        }

        .progress-wrapper { position: relative; width: 340px; height: 340px; }

        .progress-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .progress-bg { fill: none; stroke: #1e1e26; stroke-width: 24; }

        .progress-bar {
            fill: none;
            stroke: url(#progressGradient);
            stroke-width: 24;
            stroke-linecap: round;
            stroke-dasharray: 816;
            stroke-dashoffset: 816;
            transition: stroke-dashoffset 0.3s ease;
            filter: drop-shadow(0 0 15px rgba(255, 140, 0, 0.8));
        }

        .arrow-container {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: flex-start;
            pointer-events: none; z-index: 5;
            transition: transform 6s cubic-bezier(0.12, 0.8, 0.15, 1);
            transform-origin: center center;
        }

        .arrow-pointer {
            width: 0; height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 28px solid #ff8c00;
            margin-top: 22px;
            filter: drop-shadow(0 0 10px rgba(255, 140, 0, 1)) drop-shadow(0 0 20px rgba(255, 140, 0, 0.6));
            position: relative;
        }

        .arrow-pointer::after {
            content: '';
            position: absolute;
            top: -34px; left: -6px;
            width: 12px; height: 12px;
            background: radial-gradient(circle at 30% 30%, #ffaa33, #ff8c00);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 140, 0, 1);
        }

        .progress-center {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; z-index: 10;
        }

        .chance-big {
            font-family: 'Orbitron', sans-serif;
            font-size: 48px; font-weight: 900;
            color: #ff8c00;
            text-shadow: 0 0 30px rgba(255, 140, 0, 0.8);
            line-height: 1;
        }

        .chance-label {
            font-size: 14px; color: #7ed88a;
            font-weight: 700; text-transform: uppercase;
            letter-spacing: 3px; margin-top: 8px;
            text-shadow: 0 0 10px rgba(120, 200, 130, 0.5);
            min-height: 18px;
        }
        .chance-label.medium { color: #ffaa33; text-shadow: 0 0 10px rgba(255, 140, 0, 0.5); }
        .chance-label.hidden { visibility: hidden; }

        .items-row {
            display: flex; justify-content: center; align-items: center;
            gap: 15px; padding: 20px 30px;
        }

        .item-box {
            background: linear-gradient(145deg, #1e1e26 0%, #15151c 100%);
            border-radius: 18px;
            padding: 18px;
            display: flex; flex-direction: column; align-items: center;
            border: 2px solid rgba(255, 140, 0, 0.4);
            min-width: 160px;
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.2);
        }

        .item-box .label {
            font-size: 11px; color: #8a8d9b;
            font-weight: 700; text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 10px;
        }

        .item-box img {
            width: 80px; height: 80px;
            object-fit: contain; margin-bottom: 10px;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
        }

        .item-box .name {
            font-size: 13px; font-weight: 700;
            text-align: center; margin-bottom: 8px;
            color: #fff; height: 32px;
            display: flex; align-items: center;
        }

        .item-box .price {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px; font-weight: 800;
            color: #d0d0d0;
            display: flex; align-items: center; gap: 5px;
        }

        .price-coin { width: 16px; height: 16px; object-fit: contain; }

        .swap-arrow {
            font-size: 28px; color: #ff8c00;
            filter: drop-shadow(0 0 10px rgba(255, 140, 0, 0.8));
            animation: pulseArrow 2s ease-in-out infinite;
        }
        @keyframes pulseArrow {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        .upgrade-btn {
            width: calc(100% - 60px);
            margin: 0 auto;
            padding: 20px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #ff8c00 0%, #ffaa33 50%, #ff8c00 100%);
            background-size: 200% 200%;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 20px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 140, 0, 0.4), 0 0 60px rgba(255, 140, 0, 0.2);
            animation: gradientShift 3s ease infinite;
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .upgrade-btn:hover:not(:disabled) { transform: translateY(-3px) scale(1.02); box-shadow: 0 20px 50px rgba(255, 140, 0, 0.6), 0 0 100px rgba(255, 140, 0, 0.4); }
        .upgrade-btn:active { transform: scale(0.98); }
        .upgrade-btn:disabled { opacity: 0.4; cursor: not-allowed; background: #3a3d4d; animation: none; box-shadow: none; }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px; font-weight: 700;
            color: #8a8d9b; text-transform: uppercase;
            letter-spacing: 3px; margin-bottom: 10px;
            padding: 0 30px;
            display: flex; align-items: center; gap: 8px;
        }
        .section-title::before {
            content: '';
            width: 4px; height: 14px;
            background: linear-gradient(180deg, #ff8c00, #cc7000);
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.8);
        }

        .section-block { margin-top: 25px; }

        .target-row, .shop-row, .inventory-row {
            display: flex; gap: 12px;
            overflow-x: auto;
            padding: 5px 30px 15px;
            scroll-behavior: smooth;
        }

        .target-row::-webkit-scrollbar, .shop-row::-webkit-scrollbar, .inventory-row::-webkit-scrollbar { height: 5px; }
        .target-row::-webkit-scrollbar-track, .shop-row::-webkit-scrollbar-track, .inventory-row::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.03); border-radius: 3px; }
        .target-row::-webkit-scrollbar-thumb, .shop-row::-webkit-scrollbar-thumb, .inventory-row::-webkit-scrollbar-thumb { background: linear-gradient(90deg, #ff8c00, #cc7000); border-radius: 3px; }

        .inv-card, .target-card, .shop-card {
            flex-shrink: 0;
            background: linear-gradient(145deg, #1e1e26 0%, #15151c 100%);
            border-radius: 14px;
            padding: 10px;
            width: 110px;
            display: flex; flex-direction: column; align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
            position: relative;
        }

        .inv-card:hover, .target-card:hover:not(.disabled), .shop-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 140, 0, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 25px rgba(255, 140, 0, 0.2);
        }

        .inv-card.selected, .target-card.selected {
            border-color: #ff8c00;
            background: linear-gradient(145deg, rgba(255, 140, 0, 0.15) 0%, rgba(255, 140, 0, 0.05) 100%);
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.5);
        }

        .target-card.disabled { opacity: 0.25; cursor: not-allowed; filter: grayscale(1); }

        .inv-card img, .target-card img, .shop-card img {
            width: 55px; height: 55px;
            object-fit: contain; margin-bottom: 6px;
            pointer-events: none;
        }

        .inv-card .name, .target-card .name, .shop-card .name {
            font-size: 10px; font-weight: 700;
            text-align: center; margin-bottom: 4px;
            height: 24px; overflow: hidden;
            color: #e5e7ef; pointer-events: none;
        }

        .inv-card .price, .target-card .price, .shop-card .price {
            font-size: 11px; color: #ffaa33;
            font-weight: 800;
            display: flex; align-items: center; gap: 3px;
            font-family: 'Orbitron', sans-serif;
            pointer-events: none;
        }

        .buy-btn {
            width: 100%; padding: 6px;
            border-radius: 8px; border: none;
            background: linear-gradient(135deg, #ff8c00, #cc7000);
            color: white; font-weight: 800;
            font-size: 10px; cursor: pointer;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            margin-top: 6px;
            position: relative; z-index: 5;
        }
        .buy-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 140, 0, 0.6); }
        .buy-btn:disabled { opacity: 0.4; cursor: not-allowed; background: #3a3d4d; }

        .sell-btn {
            width: 100%; padding: 7px;
            border-radius: 8px;
            border: 1px solid rgba(120, 200, 130, 0.3);
            background: rgba(120, 200, 130, 0.1);
            color: #7ed88a; font-weight: 800;
            font-size: 10px; cursor: pointer;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            margin-top: 6px; letter-spacing: 1px;
            position: relative; z-index: 5;
        }
        .sell-btn:hover:not(:disabled) {
            background: rgba(120, 200, 130, 0.3);
            border-color: rgba(120, 200, 130, 0.6);
            box-shadow: 0 0 20px rgba(120, 200, 130, 0.4);
            transform: translateY(-2px);
        }
        .sell-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .empty-inv { color: #4a4d5e; font-size: 13px; text-align: center; width: 100%; padding: 20px; font-weight: 600; }

        .selectable { display: flex; flex-direction: column; align-items: center; width: 100%; cursor: pointer; }

        .locked { pointer-events: none !important; opacity: 0.4 !important; filter: grayscale(0.5) !important; }

        @media (max-width: 1100px) {
            .game-layout { grid-template-columns: 240px 1fr; gap: 15px; }
        }

        @media (max-width: 900px) {
            .game-layout { grid-template-columns: 1fr; gap: 15px; }
            .live-board { position: relative; top: 0; max-height: 200px; order: -1; }
            .live-list { flex-direction: row; overflow-x: auto; overflow-y: hidden; }
            .live-item { flex-shrink: 0; min-width: 180px; }
        }

        @media (max-width: 600px) {
            body { padding: 0; }
            .game-layout { padding: 10px; gap: 10px; }
            .live-board { border-radius: 15px; padding: 12px; }
            .live-title { font-size: 12px; }
            .app { border-radius: 20px; }
            .progress-wrapper { width: 260px; height: 260px; }
            .chance-big { font-size: 34px; }
            .arrow-pointer { margin-top: 16px; border-left-width: 12px; border-right-width: 12px; border-top-width: 24px; }
            .arrow-pointer::after { top: -30px; left: -5px; width: 10px; height: 10px; }
            .item-box { min-width: 120px; padding: 12px; }
            .item-box img { width: 60px; height: 60px; }
            .upgrade-btn { font-size: 15px; padding: 15px; letter-spacing: 2px; }
            .inv-card, .target-card, .shop-card { width: 95px; padding: 8px; }
            .inv-card img, .target-card img, .shop-card img { width: 48px; height: 48px; }
            .section-title, .target-row, .shop-row, .inventory-row { padding-left: 15px; padding-right: 15px; }
            .items-row { padding: 15px 15px; gap: 10px; }
            .upgrade-btn { width: calc(100% - 30px); }
            .top-bar { padding: 12px 15px; }
            .logo-text { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="bg-layer"></div>

<div class="game-layout">

    <div class="live-board">
        <div class="live-header">
            <div class="live-dot" id="liveDot"></div>
            <div class="live-title">LIVE BOARD</div>
            <div class="live-status" id="liveStatus">...</div>
        </div>
        <div class="live-list" id="liveList">
            <div class="live-empty">Пока нет дропов...<br>Играй и попади сюда!</div>
        </div>
    </div>

    <div class="app">
        <div class="top-bar">
            <div class="logo-text">GGbrainX</div>
            <div class="top-right">
                <div class="balance">
                    <img src="https://github.com/saintezz/saintbetW/blob/main/%D0%BC%D0%BE%D0%BD%D0%B5%D1%82%D0%B0.png?raw=true" alt="coin" class="coin-icon">
                    <span id="balanceDisplay">1 000</span>
                </div>
                <div class="avatar">P</div>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-wrapper">
                <svg class="progress-svg" viewBox="0 0 340 340">
                    <defs>
                        <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff8c00" />
                            <stop offset="100%" stop-color="#ffaa33" />
                        </linearGradient>
                    </defs>
                    <circle class="progress-bg" cx="170" cy="170" r="130"></circle>
                    <circle class="progress-bar" id="progressBar" cx="170" cy="170" r="130"></circle>
                </svg>
                <div class="arrow-container" id="arrowContainer">
                    <div class="arrow-pointer"></div>
                </div>
                <div class="progress-center">
                    <div class="chance-big" id="chanceBig">0%</div>
                    <div class="chance-label hidden" id="chanceLabel">—</div>
                </div>
            </div>
        </div>

        <div class="items-row">
            <div class="item-box">
                <div class="label">Твой предмет</div>
                <img id="sourceImg" src="" alt="" style="display:none">
                <div class="name" id="sourceName">—</div>
                <div class="price" id="sourcePrice"></div>
            </div>
            <div class="swap-arrow">➜</div>
            <div class="item-box">
                <div class="label">Цель</div>
                <img id="targetImg" src="" alt="" style="display:none">
                <div class="name" id="targetName">—</div>
                <div class="price" id="targetPrice"></div>
            </div>
        </div>

        <button class="upgrade-btn" id="upgradeBtn" disabled>Апгрейд - 0%</button>

        <div class="section-block">
            <div class="section-title">Инвентарь</div>
            <div class="inventory-row" id="inventoryRow">
                <div class="empty-inv">Инвентарь пуст</div>
            </div>
        </div>

        <div class="section-block">
            <div class="section-title">Выбери цель</div>
            <div class="target-row" id="targetRow"></div>
        </div>

        <div class="section-block">
            <div class="section-title">Магазин</div>
            <div class="shop-row" id="shopRow"></div>
        </div>
    </div>
</div>

<script>
    const COIN_IMG = 'https://github.com/saintezz/saintbetW/blob/main/%D0%BC%D0%BE%D0%BD%D0%B5%D1%82%D0%B0.png?raw=true';

    // ===== WEBSOCKET =====
    const WS_URL = (location.protocol === 'file:' || location.hostname === '')
        ? 'ws://localhost:3000'
        : `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}`;

    let ws = null;
    let myNickname = 'Игрок_' + Math.floor(Math.random() * 9000 + 1000);

    const liveDot = document.getElementById('liveDot');
    const liveStatus = document.getElementById('liveStatus');

    function setStatus(online, text) {
        if (online) {
            liveDot.classList.remove('offline');
            liveStatus.classList.remove('offline');
            liveStatus.textContent = 'ONLINE';
        } else {
            liveDot.classList.add('offline');
            liveStatus.classList.add('offline');
            liveStatus.textContent = text || 'OFFLINE';
        }
    }

    function connectWS() {
        setStatus(false, 'CONNECT...');
        console.log('Подключаюсь к', WS_URL);

        try {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                console.log('✅ WebSocket подключён');
                setStatus(true);
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'history') {
                        const list = document.getElementById('liveList');
                        list.innerHTML = '';
                        if (msg.drops.length === 0) {
                            list.innerHTML = '<div class="live-empty">Пока нет дропов...<br>Играй и попади сюда!</div>';
                        } else {
                            msg.drops.slice().reverse().forEach(drop => addLiveDrop(drop, false));
                        }
                    }
                    if (msg.type === 'new_drop') {
                        addLiveDrop(msg.drop, true);
                    }
                } catch (err) {
                    console.error('Ошибка сообщения:', err);
                }
            };

            ws.onclose = () => {
                console.log('❌ WebSocket отключён');
                setStatus(false);
                setTimeout(connectWS, 3000);
            };

            ws.onerror = (err) => {
                console.error('WebSocket ошибка:', err);
                setStatus(false, 'ERROR');
            };
        } catch (err) {
            console.error('Не удалось подключиться:', err);
            setStatus(false, 'ERROR');
            setTimeout(connectWS, 3000);
        }
    }

    function sendWin(item) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            console.warn('⚠️ WebSocket не подключён, дроп не отправлен');
            return;
        }
        ws.send(JSON.stringify({
            type: 'upgrade_win',
            nickname: myNickname,
            itemId: item.id,
            itemName: item.name,
            itemImg: item.img,
            price: item.price
        }));
        console.log('📤 Отправлен дроп:', item.name);
    }

    function addLiveDrop(drop, animate) {
        const list = document.getElementById('liveList');
        const empty = list.querySelector('.live-empty');
        if (empty) empty.remove();

        const item = document.createElement('div');
        item.className = 'live-item';
        if (!animate) item.style.animation = 'none';

        item.innerHTML = `
            <img class="live-img" src="${drop.itemImg}" alt="${drop.itemName}" onerror="this.src='https://via.placeholder.com/42?text=?'">
            <div class="live-info">
                <div class="live-name">${drop.itemName}</div>
                <div class="live-price">
                    <img class="live-coin" src="${COIN_IMG}" alt="coin">
                    ${drop.price}
                </div>
            </div>
        `;

        list.prepend(item);
        while (list.children.length > 30) list.removeChild(list.lastChild);
    }

    // ===== ИГРА =====
    const ITEMS = [
        { id: 'cupid', name: 'Cupid Wings', price: 34, img: 'https://github.com/forerer-afk/brainroterX/blob/main/cupid-wings.png?raw=true' },
        { id: 'garama', name: 'Garama and Madundung', price: 41, img: 'https://github.com/forerer-afk/brainroterX/blob/main/garama.png?raw=true' },
        { id: 'burguro', name: 'Burguro and Fryuro', price: 70, img: 'https://github.com/forerer-afk/brainroterX/blob/main/burguru.png?raw=true' },
        { id: 'celestial', name: 'Celestial Pegasus', price: 93, img: 'https://github.com/forerer-afk/brainroterX/blob/main/celestialpegasus.png?raw=true' },
        { id: 'cooki', name: 'Cooki and Milki', price: 130, img: 'https://github.com/forerer-afk/brainroterX/blob/main/cookiandmilki.png?raw=true' },
        { id: 'cerberus', name: 'Cerberus', price: 155, img: 'https://github.com/forerer-afk/brainroterX/blob/main/cerberus.png?raw=true' },
        { id: 'globba', name: 'Globba Steppa', price: 164, img: 'https://github.com/forerer-afk/brainroterX/blob/main/globastepa.png?raw=true' },
        { id: 'rubiko', name: 'Rubiko and Kubiko', price: 395, img: 'https://github.com/forerer-afk/brainroterX/blob/main/Rubiko_and_Kubiko.webp?raw=true' },
        { id: 'lossecret', name: 'Los Secret Combinasionas', price: 419, img: 'https://github.com/forerer-afk/brainroterX/blob/main/lossecretcombination.png?raw=true' },
        { id: 'dragon', name: 'Dragon Cannelloni', price: 890, img: 'https://github.com/forerer-afk/brainroterX/blob/main/dragoncannelloni.png?raw=true' },
        { id: 'hydra', name: 'Hydra Dragon Cannelloni', price: 1220, img: 'https://github.com/forerer-afk/brainroterX/blob/main/hydragoncannelloni.png?raw=true' }
    ];

    const MAX_CHANCE = 70;
    const SPIN_DURATION = 6000;
    const CIRCUMFERENCE = 2 * Math.PI * 130;

    let balance = 1000;
    let inventory = [];
    let selectedSourceId = null;
    let selectedTargetId = null;
    let isSpinning = false;

    const balanceDisplay = document.getElementById('balanceDisplay');
    const inventoryRow = document.getElementById('inventoryRow');
    const targetRow = document.getElementById('targetRow');
    const shopRow = document.getElementById('shopRow');
    const progressBar = document.getElementById('progressBar');
    const arrowContainer = document.getElementById('arrowContainer');
    const chanceBig = document.getElementById('chanceBig');
    const chanceLabel = document.getElementById('chanceLabel');
    const sourceImg = document.getElementById('sourceImg');
    const sourceName = document.getElementById('sourceName');
    const sourcePrice = document.getElementById('sourcePrice');
    const targetImg = document.getElementById('targetImg');
    const targetName = document.getElementById('targetName');
    const targetPrice = document.getElementById('targetPrice');
    const upgradeBtn = document.getElementById('upgradeBtn');

    function updateBalance() { balanceDisplay.innerText = balance.toLocaleString('ru-RU'); }
    function getItemById(id) { return ITEMS.find(item => item.id === id); }

    function enableWheelScroll(el) {
        el.addEventListener('wheel', (e) => {
            if (el.scrollWidth <= el.clientWidth) return;
            e.preventDefault();
            el.scrollLeft += e.deltaY > 0 ? 300 : -300;
        }, { passive: false });
    }

    function renderShop() {
        shopRow.innerHTML = ITEMS.map(item => `
            <div class="shop-card">
                <img src="${item.img}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/60?text=?'">
                <div class="name">${item.name}</div>
                <div class="price"><img src="${COIN_IMG}" class="price-coin" alt="coin" style="width:12px;height:12px;">${item.price}</div>
                <button class="buy-btn" onclick="buyItem('${item.id}')" ${balance < item.price || isSpinning ? 'disabled' : ''}>Купить</button>
            </div>
        `).join('');
    }

    function buyItem(id) {
        if (isSpinning) return;
        const item = getItemById(id);
        if (!item || balance < item.price) return;
        balance -= item.price;
        inventory.push(id);
        updateBalance();
        renderShop();
        renderInventory();
        updateUpgradeScreen();
    }

    window.sellItem = function(id) {
        if (isSpinning) return;
        const index = inventory.indexOf(id);
        if (index === -1) return;
        const item = getItemById(id);
        if (!item) return;
        const sellPrice = item.price;
        inventory.splice(index, 1);
        balance += sellPrice;
        if (selectedSourceId === id && !inventory.includes(id)) {
            selectedSourceId = null;
            selectedTargetId = null;
        }
        updateBalance();
        renderInventory();
        renderTargets();
        renderShop();
        updateUpgradeScreen();
    };

    function renderInventory() {
        if (inventory.length === 0) {
            inventoryRow.innerHTML = '<div class="empty-inv">Инвентарь пуст</div>';
            return;
        }
        const counts = {};
        inventory.forEach(id => { counts[id] = (counts[id] || 0) + 1; });
        inventoryRow.innerHTML = Object.keys(counts).map(id => {
            const item = getItemById(id);
            const count = counts[id];
            const isSelected = selectedSourceId === id;
            return `
                <div class="inv-card ${isSelected ? 'selected' : ''}">
                    <div class="selectable" onclick="selectSource('${id}')">
                        <img src="${item.img}" alt="${item.name}">
                        <div class="name">${item.name}</div>
                        <div class="price"><img src="${COIN_IMG}" class="price-coin" alt="coin" style="width:12px;height:12px;">${item.price}${count > 1 ? ` (x${count})` : ''}</div>
                    </div>
                    <button class="sell-btn" onclick="event.stopPropagation(); sellItem('${id}')" ${isSpinning ? 'disabled' : ''}>Продать</button>
                </div>
            `;
        }).join('');
    }

    window.selectSource = function(id) {
        if (isSpinning) return;
        if (!inventory.includes(id)) return;
        selectedSourceId = id;
        selectedTargetId = null;
        renderInventory();
        renderTargets();
        updateUpgradeScreen();
    };

    function renderTargets() {
        const sourceItem = selectedSourceId ? getItemById(selectedSourceId) : null;
        targetRow.innerHTML = ITEMS.map(item => {
            const isSelected = selectedTargetId === item.id;
            const isDisabled = sourceItem && item.price <= sourceItem.price;
            return `
                <div class="target-card ${isSelected ? 'selected' : ''} ${isDisabled ? 'disabled' : ''}" 
                     onclick="${isDisabled ? '' : `selectTarget('${item.id}')`}">
                    <img src="${item.img}" alt="${item.name}">
                    <div class="name">${item.name}</div>
                    <div class="price"><img src="${COIN_IMG}" class="price-coin" alt="coin" style="width:12px;height:12px;">${item.price}</div>
                </div>
            `;
        }).join('');
    }

    window.selectTarget = function(id) {
        if (isSpinning) return;
        const sourceItem = selectedSourceId ? getItemById(selectedSourceId) : null;
        const targetItem = getItemById(id);
        if (sourceItem && targetItem.price <= sourceItem.price) return;
        selectedTargetId = id;
        renderTargets();
        updateUpgradeScreen();
    };

    function calculateChance() {
        const sourceItem = selectedSourceId ? getItemById(selectedSourceId) : null;
        const targetItem = selectedTargetId ? getItemById(selectedTargetId) : null;
        if (!sourceItem || !targetItem || targetItem.price <= sourceItem.price) return 0;
        
        let chance = (sourceItem.price / targetItem.price) * 100;
        if (chance > MAX_CHANCE) chance = MAX_CHANCE;
        if (chance < 0) chance = 0;
        return chance;
    }

    function updateUpgradeScreen() {
        const sourceItem = selectedSourceId ? getItemById(selectedSourceId) : null;
        const targetItem = selectedTargetId ? getItemById(selectedTargetId) : null;

        if (sourceItem) {
            sourceImg.src = sourceItem.img;
            sourceImg.style.display = 'block';
            sourceName.innerText = sourceItem.name;
            sourcePrice.innerHTML = `<img src="${COIN_IMG}" class="price-coin" alt="coin">${sourceItem.price}`;
        } else {
            sourceImg.style.display = 'none';
            sourceName.innerText = '—';
            sourcePrice.innerHTML = '';
        }

        if (targetItem) {
            targetImg.src = targetItem.img;
            targetImg.style.display = 'block';
            targetName.innerText = targetItem.name;
            targetPrice.innerHTML = `<img src="${COIN_IMG}" class="price-coin" alt="coin">${targetItem.price}`;
        } else {
            targetImg.style.display = 'none';
            targetName.innerText = '—';
            targetPrice.innerHTML = '';
        }

        const chance = calculateChance();
        const displayChance = Math.floor(chance);

        const offset = CIRCUMFERENCE - (chance / 100) * CIRCUMFERENCE;
        progressBar.style.strokeDashoffset = offset;

        const angle = (chance / 100) * 360;
        arrowContainer.style.transform = `rotate(${angle}deg)`;

        chanceBig.innerText = displayChance + '%';
        
        if (displayChance >= 60) {
            chanceLabel.innerText = 'ВЫСОКИЙ ШАНС';
            chanceLabel.className = 'chance-label';
        } else if (displayChance >= 30) {
            chanceLabel.innerText = 'СРЕДНИЙ ШАНС';
            chanceLabel.className = 'chance-label medium';
        } else {
            chanceLabel.innerText = '';
            chanceLabel.className = 'chance-label hidden';
        }

        if (sourceItem && targetItem && chance > 0 && !isSpinning) {
            upgradeBtn.disabled = false;
            upgradeBtn.innerText = `Апгрейд - ${displayChance}%`;
        } else {
            upgradeBtn.disabled = true;
            upgradeBtn.innerText = 'Апгрейд - 0%';
        }
    }

    upgradeBtn.addEventListener('click', () => {
        if (isSpinning) return;
        const sourceItem = getItemById(selectedSourceId);
        const targetItem = getItemById(selectedTargetId);
        if (!sourceItem || !targetItem) return;
        if (targetItem.price <= sourceItem.price) return;

        const chance = calculateChance();
        if (chance <= 0) return;

        isSpinning = true;
        upgradeBtn.disabled = true;
        upgradeBtn.innerText = 'КРУТИМ...';
        
        inventoryRow.classList.add('locked');
        targetRow.classList.add('locked');
        shopRow.classList.add('locked');

        const baseRotation = 360 * 8;
        const randomAngle = Math.random() * 360;
        const totalRotation = baseRotation + randomAngle;

        arrowContainer.style.transition = `transform ${SPIN_DURATION}ms cubic-bezier(0.12, 0.8, 0.15, 1)`;
        arrowContainer.style.transform = `rotate(${totalRotation}deg)`;

        const successAngle = (chance / 100) * 360;
        const finalAngle = totalRotation % 360;
        const isSuccess = finalAngle <= successAngle;

        setTimeout(() => {
            if (isSuccess) {
                const sourceIndex = inventory.indexOf(selectedSourceId);
                if (sourceIndex > -1) inventory.splice(sourceIndex, 1);
                inventory.push(selectedTargetId);
                
                // ★★★ ОТПРАВЛЯЕМ В LIVE BOARD ★★★
                sendWin(targetItem);
            } else {
                const sourceIndex = inventory.indexOf(selectedSourceId);
                if (sourceIndex > -1) inventory.splice(sourceIndex, 1);
            }
            
            selectedSourceId = null;
            selectedTargetId = null;
            
            isSpinning = false;
            
            updateBalance();
            renderInventory();
            renderTargets();
            renderShop();
            updateUpgradeScreen();
            
            arrowContainer.style.transition = 'none';
            arrowContainer.style.transform = 'rotate(0deg)';
            
            upgradeBtn.disabled = true;
            inventoryRow.classList.remove('locked');
            targetRow.classList.remove('locked');
            shopRow.classList.remove('locked');
        }, SPIN_DURATION + 100);
    });

    function init() {
        updateBalance();
        renderInventory();
        renderTargets();
        renderShop();
        updateUpgradeScreen();
        
        enableWheelScroll(targetRow);
        enableWheelScroll(shopRow);
        enableWheelScroll(inventoryRow);

        connectWS();
    }

    init();
</script>

</body>
</html>
