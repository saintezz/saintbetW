<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaintBet</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:#000;
  color:#fff;
}

body{
  font-family:Arial,Helvetica,sans-serif;

  background:
    radial-gradient(
      circle at 50% 8%,
      rgba(200,200,200,.15),
      transparent 30%
    ),
    radial-gradient(
      circle at 10% 80%,
      rgba(180,180,180,.1),
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 65%,
      rgba(200,200,200,.1),
      transparent 32%
    ),
    linear-gradient(
      180deg,
      #0a0a0a 0%,
      #000 48%,
      #050505 100%
    );

  background-attachment:fixed;
}

button,
input{
  font:inherit;
}

button{
  border-radius:10px;
}

.app{
  width:100%;
  min-height:100vh;
  padding:14px 12px 28px;
  position:relative;
  z-index:1;
}

/* =========================================================
   TOP
========================================================= */

.top-nav-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
  position:relative;
  z-index:30;
}

.balance{
  min-width:145px;
  padding:10px 15px;

  border:1px solid rgba(150,150,150,.28);
  border-radius:12px;

  background:rgba(30,30,30,.88);
  color:#fff;

  font-size:14px;
  font-weight:900;

  box-shadow:
    0 8px 30px rgba(0,0,0,.3),
    0 0 25px rgba(150,150,150,.08);

  backdrop-filter:blur(10px);

  display:inline-flex;
  align-items:center;
}

.balance span{
  color:#fff;
  font-size:10px;
  letter-spacing:1.5px;
  margin:0 4px;
}

.top-shop-button{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:10px 18px;

  border:1px solid rgba(255,255,255,.35);
  border-radius:12px;

  background:
    linear-gradient(
      135deg,
      #222,
      #080808
    );

  color:#fff;

  font-size:13px;
  font-weight:900;
  letter-spacing:1px;

  cursor:pointer;

  box-shadow:
    0 8px 25px rgba(0,0,0,.5),
    0 0 20px rgba(255,255,255,.06);

  backdrop-filter:blur(10px);

  transition:all .18s ease;
}

.top-shop-button:hover{
  border-color:#fff;

  background:
    linear-gradient(
      135deg,
      #333,
      #111
    );

  box-shadow:
    0 10px 30px rgba(255,255,255,.12);

  transform:translateY(-1px);

  color:#fff;
}

.top-shop-icon{
  font-size:16px;
  filter:grayscale(1);
}

.top-shop-count{
  background:#fff;
  color:#000;

  font-size:10px;
  font-weight:900;

  padding:2px 7px;

  border-radius:12px;

  box-shadow:
    0 0 10px rgba(255,255,255,.25);
}

/* =========================================================
   GAME
========================================================= */

.game{
  min-height:430px;

  border:1px solid rgba(150,150,150,.22);
  border-radius:14px;

  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      rgba(30,30,30,.95),
      rgba(10,10,10,.98)
    );

  position:relative;
  padding-top:8px;

  box-shadow:
    0 0 70px rgba(100,100,100,.08),
    inset 0 1px 0 rgba(200,200,200,.08);
}

.top-area{
  display:grid;

  grid-template-columns:
    minmax(190px,1fr)
    330px
    minmax(190px,1fr);

  align-items:start;
  justify-content:center;

  gap:18px;

  max-width:1050px;
  margin:auto;
}

.side{
  text-align:center;
  padding-top:0;
}

.side-title{
  color:#fff;

  font-size:9px;
  letter-spacing:2px;
  font-weight:900;

  margin-bottom:13px;

  text-shadow:
    0 0 14px rgba(100,100,100,.35);
}

.slot{
  width:160px;
  min-height:124px;
  padding:10px 8px;

  margin:auto;

  border:1px solid rgba(100,100,100,.25);
  border-radius:12px;

  background:
    linear-gradient(
      145deg,
      rgba(40,40,40,.9),
      rgba(15,15,15,.95)
    );

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  cursor:pointer;
  color:#888;

  transition:.15s;

  box-shadow:
    inset 0 0 25px rgba(100,100,100,.045);
}

.slot:hover{
  border-color:rgba(180,180,180,.65);

  box-shadow:
    0 0 24px rgba(150,150,150,.12),
    inset 0 0 25px rgba(100,100,100,.08);
}

.slot.selected{
  border-color:#fff;

  box-shadow:
    0 0 28px rgba(200,200,200,.17),
    inset 0 0 25px rgba(150,150,150,.08);

  color:#fff;
}

.slot-icon{
  font-size:28px;
  margin-bottom:9px;
  color:#888;

  text-shadow:
    0 0 18px rgba(150,150,150,.35);
}

.slot-item-img-container{
  width:58px;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:6px;
}

.slot-item-img{
  max-width:100%;
  max-height:100%;

  object-fit:contain;

  filter:
    drop-shadow(
      0 4px 10px rgba(0,0,0,.6)
    );
}

.slot-text{
  color:#fff;

  font-size:9px;

  letter-spacing:1px;

  font-weight:800;

  line-height:1.4;

  text-align:center;
}

/* =========================================================
   WHEEL
========================================================= */

.center{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.wheel{
  width:218px;
  height:218px;

  border-radius:50%;

  position:relative;

  margin-top:0;

  --wheel-chance:30;

  background:
    conic-gradient(
      #fff
      0 calc(var(--wheel-chance) * 1%),

      #000
      calc(var(--wheel-chance) * 1%)
      100%
    );

  border:5px solid #000;

  box-shadow:
    0 0 35px rgba(255,255,255,.08),
    0 0 12px rgba(0,0,0,.5),
    inset 0 0 35px rgba(0,0,0,.2);
}

.wheel:before{
  content:"";

  position:absolute;
  inset:10px;

  border-radius:50%;

  border:1px solid rgba(255,255,255,.18);

  background:
    radial-gradient(
      circle,
      #080808 0 56%,
      #151515 57% 100%
    );

  box-shadow:
    inset 0 0 25px #000;
}

.tick-ring{
  position:absolute;
  inset:-1px;

  border-radius:50%;

  background:
    repeating-conic-gradient(
      transparent 0deg 9deg,
      #000 9deg 10deg
    );

  -webkit-mask:
    radial-gradient(
      transparent 0 91%,
      #000 92% 100%
    );

  mask:
    radial-gradient(
      transparent 0 91%,
      #000 92% 100%
    );
}

.pointer-wrap{
  position:absolute;

  z-index:4;
  inset:0;

  transform:rotate(0deg);

  transition:
    transform 3.8s
    cubic-bezier(.12,.78,.16,1);
}

.pointer{
  position:absolute;

  left:50%;
  top:-7px;

  width:3px;
  height:39px;

  background:#fff;

  transform:translateX(-50%);

  box-shadow:
    0 0 4px #fff;
}

.pointer:after{
  content:"";

  position:absolute;

  left:50%;
  top:0;

  transform:
    translate(-50%,-2px);

  border-left:6px solid transparent;
  border-right:6px solid transparent;
  border-top:9px solid #fff;
}

.wheel-center{
  position:absolute;

  z-index:5;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  flex-direction:column;
}

.wheel-label{
  font-size:9px;

  letter-spacing:3px;

  color:#aaa;

  font-weight:900;

  margin-bottom:8px;
}

.wheel-chance{
  font-size:31px;

  font-weight:900;

  color:#fff;
}

/* Убрана странная стрелка / символ снизу */

.center-symbol{
  display:none;
}

.controls{
  display:flex;

  align-items:center;

  margin-top:14px;

  gap:7px;
}

.upgrade{
  height:44px;
  min-width:180px;

  border:
    1px solid
    rgba(200,200,200,.18);

  background:
    linear-gradient(
      115deg,
      rgba(120,120,120,.28),
      rgba(100,100,100,.14),
      rgba(150,150,150,.14)
    );

  color:#fff;

  letter-spacing:3px;
  font-size:18px;

  cursor:pointer;

  transition:.2s;
}

.upgrade.ready{
  color:#fff;

  border-color:
    rgba(255,255,255,.32);
}

.upgrade:hover{
  transform:
    translateY(-2px);

  background:
    linear-gradient(
      115deg,
      rgba(150,150,150,.48),
      rgba(120,120,120,.25),
      rgba(170,170,170,.25)
    );

  box-shadow:
    0 10px 30px rgba(150,150,150,.25),
    inset 0 1px rgba(255,255,255,.18);
}

.upgrade:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.energy{
  width:44px;
  height:44px;

  border:
    1px solid
    rgba(200,200,200,.18);

  background:
    linear-gradient(
      115deg,
      rgba(120,120,120,.28),
      rgba(100,100,100,.14),
      rgba(150,150,150,.14)
    );

  color:#fff;

  font-size:21px;

  cursor:pointer;
}

.instruction{
  text-align:center;

  color:#fff;

  font-size:11px;

  line-height:1.45;

  margin-top:76px;
}

/* =========================================================
   LOWER
========================================================= */

.lower{
  display:grid;

  grid-template-columns:
    1fr
    1fr
    1fr;

  gap:12px;

  margin-top:12px;
}

.panel{
  min-height:342px;

  padding:10px;

  border:
    1px solid
    rgba(150,150,150,.16);

  border-radius:20px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.11),
      rgba(255,255,255,.035) 55%,
      rgba(150,150,150,.045)
    ),
    rgba(30,30,30,.55);

  backdrop-filter:
    blur(20px)
    saturate(145%);

  box-shadow:
    0 18px 50px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.11),
    inset 0 -1px 0 rgba(255,255,255,.035);
}

.panel-title{
  color:#fff;

  font-size:10px;

  letter-spacing:2px;

  font-weight:900;

  border-left:3px solid #fff;

  padding-left:8px;

  margin:0 0 10px;

  text-shadow:
    0 0 12px rgba(100,100,100,.25);
}

.target-panel{
  background:
    linear-gradient(
      145deg,
      rgba(35,35,35,.95),
      rgba(8,8,8,.98)
    ) !important;
}

.target-panel .panel-title{
  border-left-color:#fff;
}

.shop-title{
  border-left-color:#fff;
}

.inventory-status{
  color:#fff;

  font-size:10px;

  margin:15px 2px;
}

.selected-card{
  display:none;

  margin-top:14px;
  padding:12px 10px;

  border:1px solid #555;

  background:
    linear-gradient(
      145deg,
      #1c1c1c,
      #0d0d0d
    );

  min-height:120px;

  align-items:center;
  justify-content:center;

  flex-direction:column;

  border-radius:12px;

  box-shadow:
    inset 0 0 20px rgba(0,0,0,.6);
}

.selected-card.show{
  display:flex;
}

.selected-card-img-container{
  width:58px;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:6px;
}

.selected-card-img{
  max-width:100%;
  max-height:100%;

  object-fit:contain;

  filter:
    drop-shadow(
      0 4px 10px rgba(0,0,0,.7)
    );
}

.selected-number{
  font-size:15px;

  font-weight:900;

  color:#fff;

  text-align:center;

  max-width:90%;

  line-height:1.25;
}

.selected-caption{
  font-size:9px;

  color:#aaa;

  letter-spacing:1.5px;

  margin-top:5px;
}

.search{
  width:100%;
  height:29px;

  border:
    1px solid
    rgba(150,150,150,.13);

  background:
    rgba(25,25,25,.48);

  color:#fff;

  padding:0 10px;

  outline:none;

  font-size:10px;

  margin-bottom:10px;

  border-radius:13px;
}

.search:focus{
  border-color:
    rgba(150,150,150,.65);

  box-shadow:
    0 0 0 3px rgba(150,150,150,.12),
    0 0 25px rgba(120,120,120,.08);
}

/* =========================================================
   TARGET STYLE
========================================================= */

.items{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:7px;
}

.item{
  min-height:112px;

  border:
    1px solid
    rgba(150,150,150,.16);

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.11),
      rgba(255,255,255,.035) 55%,
      rgba(150,150,150,.045)
    );

  padding:8px 5px 7px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  cursor:pointer;

  transition:.15s ease;

  position:relative;

  border-radius:10px !important;

  color:#fff;
}

.item:hover{
  border-color:
    rgba(150,150,150,.55);

  transform:
    translateY(-2px);

  box-shadow:
    0 4px 18px
    rgba(150,150,150,.15);
}

.item.selected{
  border-color:#fff;

  background:
    linear-gradient(
      145deg,
      #202020,
      #111
    );

  box-shadow:
    0 0 20px
    rgba(200,200,200,.2);
}

.target-item-img-container{
  width:48px;
  height:48px;

  display:flex;

  align-items:center;
  justify-content:center;

  margin-bottom:5px;
}

.target-item-img{
  max-width:100%;
  max-height:100%;

  object-fit:contain;

  filter:
    drop-shadow(
      0 2px 6px rgba(0,0,0,.5)
    );

  transition:
    transform .18s ease;
}

.item:hover .target-item-img{
  transform:scale(1.1);
}

.item.selected .target-item-img{
  transform:scale(1.12);

  filter:
    drop-shadow(
      0 0 8px
      rgba(255,255,255,.45)
    );
}

.item-name{
  color:#fff;

  font-size:10px;

  line-height:1.2;

  font-weight:800;

  max-width:100%;

  overflow:hidden;

  text-overflow:ellipsis;
}

.item-price{
  margin-top:4px;

  color:#fff;

  font-size:11px;

  font-weight:900;
}

/* =========================================================
   SHOP LIKE TARGET
========================================================= */

.shop-items{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:7px;
}

.shop-item{
  min-height:135px;

  border:
    1px solid
    rgba(150,150,150,.16);

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.11),
      rgba(255,255,255,.035) 55%,
      rgba(150,150,150,.045)
    );

  padding:7px 6px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  cursor:pointer;

  transition:.15s ease;

  position:relative;

  border-radius:10px;
}

.shop-item:hover{
  border-color:
    rgba(150,150,150,.55);

  transform:
    translateY(-2px);

  box-shadow:
    0 4px 18px
    rgba(150,150,150,.15);
}

.shop-item-img-container{
  width:58px;
  height:58px;

  display:flex;

  align-items:center;
  justify-content:center;

  margin-bottom:5px;
}

.shop-item-img{
  max-width:100%;
  max-height:100%;

  object-fit:contain;

  filter:
    drop-shadow(
      0 2px 7px rgba(0,0,0,.6)
    );

  transition:
    transform .18s ease;
}

.shop-item:hover .shop-item-img{
  transform:scale(1.1);
}

.shop-item-info{
  width:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;
}

.shop-item-name{
  color:#fff;

  font-size:9px;

  font-weight:800;

  line-height:1.2;

  max-width:100%;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

.shop-item-price{
  color:#fff;

  font-size:10px;

  font-weight:900;

  margin-top:3px;
}

.buy-item{
  width:100%;

  height:27px;

  margin-top:6px;

  padding:0 4px;

  border:
    1px solid
    rgba(255,255,255,.22) !important;

  border-radius:8px !important;

  background:
    linear-gradient(
      145deg,
      #272727,
      #111
    ) !important;

  color:#fff !important;

  font-size:9px;

  font-weight:900;

  letter-spacing:.7px;

  cursor:pointer;

  transition:.15s ease;
}

.buy-item:hover{
  border-color:#fff !important;

  background:
    linear-gradient(
      145deg,
      #363636,
      #161616
    ) !important;

  box-shadow:
    0 0 15px
    rgba(255,255,255,.1);
}

.buy-item:disabled{
  opacity:.35;

  cursor:not-allowed;
}

/* =========================================================
   INVENTORY
========================================================= */

.inventory-list{
  display:flex;

  flex-direction:column;

  gap:6px;

  margin-top:10px;
}

.inventory-item{
  border:
    1px solid
    rgba(150,150,150,.16);

  background:
    linear-gradient(
      145deg,
      rgba(35,35,35,.75),
      rgba(15,15,15,.9)
    );

  padding:6px 8px;

  display:flex;

  align-items:center;

  gap:9px;

  cursor:pointer;

  border-radius:10px;

  transition:.15s;
}

.inventory-item-img-container{
  width:40px;
  height:40px;

  border-radius:8px;

  background:
    rgba(0,0,0,.45);

  border:
    1px solid
    rgba(255,255,255,.08);

  display:flex;

  align-items:center;
  justify-content:center;

  flex-shrink:0;

  padding:2px;
}

.inventory-item-img{
  max-width:100%;
  max-height:100%;

  object-fit:contain;

  filter:
    drop-shadow(
      0 2px 6px rgba(0,0,0,.5)
    );
}

.inventory-item:hover{
  border-color:
    rgba(150,150,150,.55);

  background:
    linear-gradient(
      145deg,
      rgba(50,50,50,.82),
      rgba(20,20,20,.95)
    );

  box-shadow:
    0 0 18px
    rgba(150,150,150,.08);
}

.inventory-item.selected{
  border-color:#fff;

  background:#201e0d;
}

.inventory-item-info{
  flex:1;

  min-width:0;

  display:flex;

  flex-direction:column;

  justify-content:center;
}

.inventory-item-name{
  font-size:10px;

  color:#fff;

  font-weight:800;

  line-height:1.2;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.inventory-item-price{
  font-size:10px;

  color:#fff;

  font-weight:900;

  margin-top:3px;
}

.sell-item{
  flex-shrink:0;

  height:30px;

  padding:0 9px;

  border:
    1px solid
    rgba(220,70,80,.45) !important;

  background:
    rgba(80,20,25,.65) !important;

  color:#ff7882 !important;

  font-size:8px;

  font-weight:900;

  cursor:pointer;

  white-space:nowrap;
}

.sell-item:hover{
  background:
    rgba(120,25,35,.8) !important;

  border-color:#ff5b68 !important;

  color:#fff !important;
}

/* =========================================================
   PROFILE
========================================================= */

.profile-panel{
  position:relative;
}

.profile-title{
  border-left-color:
    #fff !important;
}

.profile-card{
  min-height:205px;

  display:flex;

  align-items:center;

  flex-direction:column;

  justify-content:center;

  padding:12px;

  border:
    1px solid
    rgba(100,100,100,.16);

  border-radius:12px;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(100,100,100,.12),
      transparent 42%
    ),
    rgba(25,25,25,.7);
}

.profile-avatar{
  width:58px;
  height:58px;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:24px;

  font-weight:900;

  color:#000;

  background:
    linear-gradient(
      145deg,
      #aaa,
      #777
    );

  box-shadow:
    0 0 24px
    rgba(150,150,150,.22);

  margin-bottom:10px;
}

.profile-username{
  font-size:18px;

  font-weight:900;

  color:#fff;

  letter-spacing:.5px;
}

.profile-meta{
  margin-top:5px;

  color:#fff;

  font-size:9px;

  letter-spacing:1.4px;

  text-transform:uppercase;
}

.telegram-account-button{
  display:flex;

  align-items:center;
  justify-content:center;

  text-decoration:none;

  box-sizing:border-box;
}

.profile-button,
.admin-button{
  width:100%;
  height:36px;

  margin-top:14px;

  border:
    1px solid
    rgba(150,150,150,.3);

  background:
    linear-gradient(
      135deg,
      rgba(100,100,100,.85),
      rgba(120,120,120,.85)
    );

  color:#fff;

  font-size:10px;

  font-weight:900;

  letter-spacing:1.2px;

  cursor:pointer;
}

.profile-button:hover,
.admin-button:hover{
  filter:brightness(1.12);

  box-shadow:
    0 0 20px
    rgba(150,150,150,.13);
}

.profile-cooldown{
  min-height:25px;

  margin-top:8px;

  color:#fff;

  font-size:9px;

  line-height:1.4;

  text-align:center;
}

.admin-panel{
  margin-top:12px;

  padding:12px;

  border:
    1px solid
    rgba(150,150,150,.3);

  border-radius:12px;

  background:
    linear-gradient(
      145deg,
      rgba(50,50,50,.42),
      rgba(20,20,20,.75)
    );
}

.admin-title{
  color:#fff;

  font-weight:900;

  font-size:11px;

  letter-spacing:1.5px;
}

.admin-subtitle{
  margin:4px 0 10px;

  color:#fff;

  font-size:9px;
}

.admin-input{
  width:100%;

  height:32px;

  margin-top:7px;

  padding:0 9px;

  outline:none;

  border:
    1px solid
    rgba(100,100,100,.2);

  border-radius:7px;

  background:
    rgba(20,20,20,.9);

  color:#fff;

  font-size:10px;
}

.admin-input:focus{
  border-color:#fff;
}

.admin-button{
  color:#000;

  background:
    linear-gradient(
      135deg,
      #bbb,
      #888
    );
}

.admin-message{
  min-height:18px;

  margin-top:8px;

  color:#fff;

  font-size:9px;

  line-height:1.4;
}

/* =========================================================
   WITHDRAW SHOP MODAL
========================================================= */

.withdraw-modal{
  position:fixed;

  inset:0;

  z-index:99999;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:16px;

  background:
    rgba(0,0,0,.82);

  backdrop-filter:blur(10px);
}

.withdraw-modal[hidden]{
  display:none;
}

.withdraw-modal-box{
  width:min(680px,100%);

  max-height:88vh;

  display:flex;

  flex-direction:column;

  border:
    1px solid
    rgba(255,255,255,.3);

  border-radius:18px;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(100,100,100,.16),
      transparent 55%
    ),
    linear-gradient(
      165deg,
      #1e1e1e 0%,
      #121212 60%,
      #0a0a0a 100%
    );

  box-shadow:
    0 25px 80px rgba(0,0,0,.85),
    0 0 50px rgba(255,255,255,.06),
    inset 0 1px 0 rgba(255,255,255,.1);

  overflow:hidden;

  animation:
    modalPop
    .25s
    cubic-bezier(.16,1,.3,1);
}

@keyframes modalPop{
  from{
    transform:
      scale(.94)
      translateY(10px);

    opacity:0;
  }

  to{
    transform:
      scale(1)
      translateY(0);

    opacity:1;
  }
}

.withdraw-modal-header{
  display:flex;

  align-items:center;
  justify-content:space-between;

  padding:
    16px
    20px
    14px;

  border-bottom:
    1px solid
    rgba(150,150,150,.15);

  background:
    rgba(20,20,20,.6);
}

.withdraw-modal-title-area{
  display:flex;

  flex-direction:column;

  gap:2px;
}

.withdraw-modal-badge{
  font-size:9px;

  font-weight:900;

  letter-spacing:2px;

  color:#fff;

  text-transform:uppercase;
}

.withdraw-modal-title{
  margin:0;

  font-size:18px;

  font-weight:900;

  letter-spacing:1px;

  color:#fff;

  display:flex;

  align-items:center;

  gap:8px;
}

.withdraw-modal-close{
  width:34px;
  height:34px;

  border:
    1px solid
    rgba(150,150,150,.25);

  border-radius:10px;

  background:
    rgba(30,30,30,.8);

  color:#fff;

  font-size:16px;

  font-weight:900;

  cursor:pointer;

  display:flex;

  align-items:center;
  justify-content:center;

  transition:.15s;
}

.withdraw-modal-close:hover{
  border-color:#fff;

  color:#fff;

  background:#444;
}

.withdraw-modal-subbar{
  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    10px
    20px;

  background:
    rgba(25,25,25,.5);

  border-bottom:
    1px solid
    rgba(150,150,150,.1);

  font-size:11px;

  color:#fff;

  flex-wrap:wrap;

  gap:6px;
}

.withdraw-modal-subbar b{
  color:#fff;
}

.withdraw-modal-body{
  padding:
    16px
    20px;

  overflow-y:auto;

  flex:1;

  display:flex;

  flex-direction:column;

  gap:10px;
}

.withdraw-admin-panel{
  border:
    1px solid
    rgba(255,255,255,.25);

  border-radius:12px;

  background:
    linear-gradient(
      145deg,
      rgba(45,45,45,.75),
      rgba(20,20,20,.9)
    );

  padding:12px;

  margin-bottom:8px;
}

.withdraw-admin-head{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;
}

.withdraw-admin-tag{
  color:#fff;

  font-size:11px;

  font-weight:900;

  letter-spacing:1px;
}

.withdraw-admin-add-toggle{
  padding:
    6px
    12px;

  border:
    1px solid
    rgba(255,255,255,.3);

  border-radius:8px;

  background:
    rgba(255,255,255,.08);

  color:#fff;

  font-size:10px;

  font-weight:900;

  cursor:pointer;

  transition:.15s;
}

.withdraw-admin-add-toggle:hover{
  background:
    rgba(255,255,255,.15);

  color:#fff;
}

.withdraw-admin-form{
  margin-top:10px;

  padding-top:10px;

  border-top:
    1px solid
    rgba(255,255,255,.15);

  display:flex;

  flex-direction:column;

  gap:8px;
}

.withdraw-admin-form-row{
  display:grid;

  grid-template-columns:
    2fr
    1fr
    1fr;

  gap:8px;
}

.withdraw-admin-input{
  height:34px;

  padding:0 10px;

  border:
    1px solid
    rgba(150,150,150,.3);

  border-radius:8px;

  background:
    rgba(15,15,15,.9);

  color:#fff;

  font-size:11px;

  outline:none;
}

.withdraw-admin-input:focus{
  border-color:#fff;
}

.withdraw-admin-form-actions{
  display:flex;

  gap:8px;
}

.withdraw-admin-submit-btn{
  flex:1;

  height:34px;

  border:
    1px solid
    #fff;

  border-radius:8px;

  background:
    linear-gradient(
      135deg,
      #fff,
      #aaa
    );

  color:#000;

  font-size:10px;

  font-weight:900;

  cursor:pointer;
}

.withdraw-admin-submit-btn:hover{
  filter:brightness(1.1);
}

.withdraw-admin-msg{
  font-size:10px;

  min-height:14px;

  color:#fff;
}

.withdraw-items-list{
  display:flex;

  flex-direction:column;

  gap:8px;
}

.withdraw-item-row{
  display:flex;

  flex-direction:column;

  gap:8px;

  padding:
    12px
    14px;

  border:
    1px solid
    rgba(150,150,150,.18);

  border-radius:12px;

  background:
    linear-gradient(
      145deg,
      rgba(35,35,35,.85),
      rgba(15,15,15,.95)
    );

  transition:all .18s ease;

  position:relative;
}

.withdraw-item-row:hover{
  border-color:
    rgba(255,255,255,.4);

  background:
    linear-gradient(
      145deg,
      rgba(45,45,45,.9),
      rgba(20,20,20,.98)
    );

  box-shadow:
    0 0 20px
    rgba(255,255,255,.06);
}

.withdraw-item-row.out-of-stock{
  opacity:.65;

  border-color:
    rgba(100,100,100,.15);
}

.withdraw-item-main{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  flex-wrap:wrap;
}

.withdraw-item-text-line{
  font-size:13px;

  font-weight:800;

  color:#fff;

  line-height:1.35;

  letter-spacing:.3px;
}

.withdraw-item-text-line .highlight-stock{
  color:#aaa;

  font-weight:700;

  font-size:11px;
}
